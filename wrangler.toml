# Cloudflare Workers の設定。
# OpenNext がビルド成果物(.open-next)を探すため、リポジトリのルートに置く。
# database_id は作成済みのD1のもの。bucket_name はR2を作ったら確認する。
# ここに書く値はいずれも秘密情報ではないため、リポジトリに含めてよい。
# APIトークンやアクセスキーはこのファイルに書かず、Cloudflare側に登録する。

name = "selenia-aroma"
main = ".open-next/worker.js"
compatibility_date = "2026-08-17"
compatibility_flags = ["nodejs_compat"]

# JS・CSS・フォントなどの静的ファイルの置き場。
# これが無いと /_next/static/* が404になり、ブラウザでJSが読み込まれず
# 画面が固定データのまま動かなくなる(ハイドレーションが起きない)。
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "selenia-aroma"
database_id = "c06d174c-ab1f-4b82-9bb1-7b69a297980d"

# R2(脳波画像の保管)はバケットを作ってから有効にする。
# 存在しないバケットを書いたままだとデプロイが失敗するため、いまは外してある。
# バケット selenia-aroma-images を作ったら、下の3行のコメントを外す。
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "selenia-aroma-images"

[vars]
# 購入者向けアプリとして動かす。/admin と /operator は /dashboard へ流す
NEXT_PUBLIC_APP_TARGET = "customer"
